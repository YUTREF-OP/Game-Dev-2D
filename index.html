<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>The Broken Firmament: Diver — Movement Sandbox</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0e17;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Crisp pixel enforcement: never let the browser smooth the scaled canvas. */
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    #boot-error {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #f4f4f4;
      font: 14px/1.5 monospace;
      text-align: center;
    }
  </style>
  <!-- Phaser 3 from CDN (global `Phaser`). No build step: the repo runs as-is on GitHub Pages. -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="boot-error"></div>
  <!-- Relative path only: GitHub Pages serves this repo from /<repo-name>/. -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
